<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUIRK REGISTRY // Терминал вызова героев MHA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #0a0e1a;
    --panel: #121a30;
    --panel-2: #0c1224;
    --border: #243152;
    --cyan: #00f0ff;
    --magenta: #ff2e63;
    --amber: #ffd60a;
    --text: #d8e3ff;
    --text-dim: #5e6f9c;
    --font-display: 'Orbitron', sans-serif;
    --font-body: 'Rajdhani', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }

  body {
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
    background-size: 42px 42px;
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 0%, var(--bg) 80%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 760px;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 4px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  h1.title {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    letter-spacing: 6px;
    text-transform: uppercase;
    margin: 8px 0 4px;
    background: linear-gradient(90deg, var(--cyan), #6fa8ff, var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  .terminal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 0 50px rgba(0, 240, 255, 0.08), inset 0 0 80px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }

  .terminal-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }

  .term-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .term-dot.cyan { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .term-dot.magenta { background: var(--magenta); box-shadow: 0 0 8px var(--magenta); }
  .term-dot.amber { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

  .term-path {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-left: 4px;
  }

  .terminal-body {
    padding: clamp(20px, 4vw, 40px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .summon-btn {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 18px 56px;
    background: transparent;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s, transform 0.1s;
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.5), inset 0 0 12px rgba(0, 240, 255, 0.08);
    animation: pulse-glow 2.6s ease-in-out infinite;
  }

  .summon-btn:hover:not(:disabled) {
    background: var(--cyan);
    color: var(--bg);
    box-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(0, 240, 255, 0.4);
    transform: translateY(-1px);
  }

  .summon-btn:active:not(:disabled) {
    transform: translateY(1px);
  }

  .summon-btn:disabled {
    cursor: wait;
    opacity: 0.55;
    border-color: var(--text-dim);
    color: var(--text-dim);
    box-shadow: none;
    animation: none;
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 12px rgba(0, 240, 255, 0.5), inset 0 0 12px rgba(0, 240, 255, 0.08); }
    50% { box-shadow: 0 0 26px rgba(0, 240, 255, 0.85), inset 0 0 18px rgba(0, 240, 255, 0.18); }
  }

  .result-area {
    width: 100%;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- Placeholder --- */
  .placeholder {
    border: 1px dashed var(--border);
    border-radius: 6px;
    width: 100%;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }

  .placeholder p {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    line-height: 1.8;
  }

  /* --- Loader --- */
  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .scan-ring {
    width: 70px;
    height: 70px;
    border: 3px solid var(--border);
    border-top-color: var(--cyan);
    border-right-color: var(--magenta);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 3px;
    color: var(--cyan);
    text-transform: uppercase;
    animation: flicker 1.3s infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* --- Card --- */
  .card {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    animation: scan-reveal 0.55s ease-out;
  }

  .card.hero { border-color: var(--cyan); box-shadow: 0 0 28px rgba(0, 240, 255, 0.18); }
  .card.villain { border-color: var(--magenta); box-shadow: 0 0 28px rgba(255, 46, 99, 0.18); }
  .card.civilian { border-color: var(--amber); box-shadow: 0 0 28px rgba(255, 214, 10, 0.18); }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(0, 240, 255, 0.35) 50%, transparent 100%);
    animation: scan-line 0.7s ease-out forwards;
    pointer-events: none;
  }

  .card.villain::after {
    background: linear-gradient(180deg, transparent 0%, rgba(255, 46, 99, 0.35) 50%, transparent 100%);
  }

  @keyframes scan-reveal {
    from { opacity: 0; clip-path: inset(0 0 100% 0); }
    to { opacity: 1; clip-path: inset(0 0 0% 0); }
  }

  @keyframes scan-line {
    from { transform: translateY(-100%); }
    to { transform: translateY(100%); }
  }

  .card-info {
    padding: clamp(18px, 3vw, 28px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }

  .faction-badge {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 3px;
    width: fit-content;
  }

  .card.hero .faction-badge { color: var(--cyan); border: 1px solid var(--cyan); background: rgba(0, 240, 255, 0.08); }
  .card.villain .faction-badge { color: var(--magenta); border: 1px solid var(--magenta); background: rgba(255, 46, 99, 0.08); }
  .card.civilian .faction-badge { color: var(--amber); border: 1px solid var(--amber); background: rgba(255, 214, 10, 0.08); }

  .char-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.25rem, 4vw, 1.7rem);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 0;
    line-height: 1.25;
  }

  .quirk-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-left: 3px solid var(--border);
    padding-left: 10px;
  }

  .card.hero .quirk-row { border-left-color: var(--cyan); }
  .card.villain .quirk-row { border-left-color: var(--magenta); }
  .card.civilian .quirk-row { border-left-color: var(--amber); }

  .quirk-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 3px;
    color: var(--text-dim);
  }

  .quirk-value {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 1.05rem;
  }

  .char-desc {
    font-family: var(--font-body);
    font-size: 0.95rem;
    line-height: 1.55;
    color: var(--text);
    margin: 0;
  }

  footer {
    margin-top: 18px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* --- Responsive --- */
  @media (max-width: 600px) {
    .summon-btn { width: 100%; padding: 18px 0; }
  }
</style>
</head>

  // ======================================================
  // ЛОГИКА ПРИЛОЖЕНИЯ
  // ======================================================
  const summonBtn = document.getElementById('summonBtn');
  const resultArea = document.getElementById('resultArea');
  let isLoading = false;

  // Определяем "тему" карточки по фракции персонажа
  function getTheme(faction) {
    if (faction.includes('Злодей')) return 'villain';
    if (faction.includes('Гражданск')) return 'civilian';
    return 'hero';
  }

  function setButtonState(loading) {
    isLoading = loading;
    summonBtn.disabled = loading;
    summonBtn.textContent = loading ? 'СКАНИРОВАНИЕ...' : '⚡ Призвать!';
  }

  function renderLoader() {
    resultArea.innerHTML = `
      <div class="loader">
        <div class="scan-ring"></div>
        <p class="loader-text">Загрузка данных из реестра...</p>
      </div>
    `;
  }

  function renderCard(character, theme) {
    resultArea.innerHTML = `
      <div class="card ${theme}">
        <div class="card-info">
          <span class="faction-badge">${character.faction}</span>
          <h2 class="char-name">${character.name}</h2>
          <div class="quirk-row">
            <span class="quirk-label">ПРИЧУДА</span>
            <span class="quirk-value">${character.quirk}</span>
          </div>
          <p class="char-desc">${character.description}</p>
        </div>
      </div>
    `;
  }

  summonBtn.addEventListener('click', () => {
    if (isLoading) return;

    setButtonState(true);
    renderLoader();

    const character = characters[Math.floor(Math.random() * characters.length)];
    const theme = getTheme(character.faction);

    // Небольшая задержка для эффекта "сканирования реестра"
    setTimeout(() => {
      renderCard(character, theme);
      setButtonState(false);
    }, 500);
  });
</script>
