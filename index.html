        body {
            background-color: #121214;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ffcc00;
            text-shadow: 3px 3px 0px #e94560, -1px -1px 0px #000;
            font-size: 2.8rem;
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #a0a0b8;
            font-size: 1.1rem;
            margin-bottom: 25px;
            font-weight: bold;
            background: #1a1a2e;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .card {
            background-color: #1a1a1a;
            border: 4px solid #ffcc00;
            border-radius: 20px;
            padding: 25px;
            width: 440px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-container {
            width: 360px;
            height: 380px;
            background-color: #0b0b0c;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #2d2d30;
            margin-bottom: 15px;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .loading-text {
            color: #ffcc00;
            font-size: 1.1rem;
            display: none;
            position: absolute;
            font-weight: bold;
        }

        .placeholder-text {
            color: #a0a0b8;
            font-size: 1rem;
            padding: 20px;
            line-height: 1.5;
        }

        .char-name {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 5px 0;
            color: #ffffff;
            text-transform: uppercase;
        }

        .info-block {
            width: 100%;
            text-align: left;
            background: #242428;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            box-sizing: border-box;
            display: none;
        }

        .info-item {
            margin-bottom: 8px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .label {
            font-weight: bold;
            color: #ffcc00;
        }

        .quirk-label {
            font-weight: bold;
            color: #ff4a7d;
        }

        button {
            background: linear-gradient(135deg, #e94560, #ff2a5f);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
            transition: all 0.15s ease;
            margin-top: 20px;
            width: 100%;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.6);
        }

        function getRandomCharacter() {
            const randomIndex = Math.floor(Math.random() * characters.length);
            const luckyChar = characters[randomIndex];

            const nameLabel = document.getElementById('char-name');
            const imgElement = document.getElementById('char-img');
            const placeholderText = document.getElementById('placeholder-text');
            const spinner = document.getElementById('loading-spinner');
            const infoBlock = document.getElementById('info-block');
            
            nameLabel.innerText = luckyChar.name;
            document.getElementById('char-status').innerText = luckyChar.status;
            document.getElementById('char-quirk').innerText = luckyChar.quirk;
            document.getElementById('char-desc').innerText = luckyChar.desc;
            infoBlock.style.display = "block";

            imgElement.style.display = "none";
            placeholderText.style.display = "none";
            spinner.style.display = "block"; 

            // Сборка URL-адреса через безопасный прокси для обхода CORS на GitHub
            imgElement.src = proxy + encodeURIComponent(luckyChar.img);

            imgElement.onload = function() {
                spinner.style.display = "none";
                imgElement.style.display = "block";
            };

            imgElement.onerror = function() {
                spinner.style.display = "none";
                placeholderText.style.display = "block";
                placeholderText.innerHTML = `<span style="color:#e94560;font-weight:bold;">Ошибка изображения</span><br>Фандом временно ограничил этот арт. Попробуй еще раз!`;
            };
        }
    </script>
